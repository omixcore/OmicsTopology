name: Build PLOS Computational Biology submission package

on:
  push:
    branches:
      - submission/plos-computational-biology
    paths:
      - 'publication/.transfer/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Check out submission branch
        uses: actions/checkout@v4
        with:
          ref: submission/plos-computational-biology
          persist-credentials: true

      - name: Reassemble versioned publication sources
        shell: bash
        run: |
          set -euo pipefail
          test -f publication/.transfer/READY
          if compgen -G "publication/.transfer/source_bundle.tar.xz.b64.part*" > /dev/null; then
            cat publication/.transfer/source_bundle.tar.xz.b64.part* > /tmp/plos-source-bundle.b64
            base64 --decode /tmp/plos-source-bundle.b64 > /tmp/plos-source-bundle.tar.xz
            tar -xJf /tmp/plos-source-bundle.tar.xz -C .
            rm -f publication/.transfer/source_bundle.tar.xz.b64.part*
          else
            echo "No staged archive; rebuilding from the committed publication sources."
          fi
          rm -rf publication/asset_sources
          find publication/supplementary_figures -maxdepth 1 -type f -name 'Figure_S*' -delete
          test -s publication/OmicsTopology_PLOS_Comp_Biol_manuscript.md
          test -s publication/OmicsTopology_PLOS_Comp_Biol_supporting_information.md
          test "$(find publication/figures -maxdepth 1 -name 'Fig*.svg' | wc -l)" -eq 6
          test "$(find publication/supplementary_figures -maxdepth 1 -name 'S*_Fig.svg' | wc -l)" -eq 11

      - name: Install document and vector-rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
          python -m pip install --upgrade pip
          python -m pip install python-docx cairosvg pillow pypdf

      - name: Build Word/PDF files and render editable figures
        run: python publication/build_publication.py

      - name: Validate citation sequence, in-text references, and outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("publication")
          manuscript = (root / "OmicsTopology_PLOS_Comp_Biol_manuscript.md").read_text(encoding="utf-8")
          match = re.search(r"(?ms)^## References\s*\n(.*?)(?=^## Supporting Information Captions|\Z)", manuscript)
          if not match:
              raise SystemExit("References section not found")
          ref_text = match.group(1)
          ref_numbers = [int(x) for x in re.findall(r"(?m)^(\d+)\.\s", ref_text)]
          if ref_numbers != list(range(1, len(ref_numbers) + 1)):
              raise SystemExit(f"Reference list is not sequential: {ref_numbers}")
          body = manuscript[:match.start()]
          abstract = re.search(r"(?ms)^## Abstract\s*\n(.*?)(?=^## Author Summary)", body)
          if abstract and re.search(r"\[\s*\d", abstract.group(1)):
              raise SystemExit("PLOS rule check failed: citations must not appear in the Abstract")
          cited = set()
          first_appearance = []
          pattern = re.compile(r"\[((?:\d+(?:\s*[-–—]\s*\d+)?)(?:\s*[,;]\s*\d+(?:\s*[-–—]\s*\d+)?)*)\]")
          for citation in pattern.finditer(body):
              for token in re.split(r"\s*[,;]\s*", citation.group(1)):
                  token = re.sub(r"\s+", "", token).replace("–", "-").replace("—", "-")
                  if "-" in token:
                      a, b = map(int, token.split("-", 1))
                      values = range(a, b + 1)
                  else:
                      values = [int(token)]
                  for value in values:
                      cited.add(value)
                      if value not in first_appearance:
                          first_appearance.append(value)
          if cited != set(ref_numbers):
              raise SystemExit(f"In-text/reference mismatch: uncited={sorted(set(ref_numbers)-cited)}, missing={sorted(cited-set(ref_numbers))}")
          if first_appearance != list(range(1, len(ref_numbers) + 1)):
              raise SystemExit(f"First-citation order is not sequential: {first_appearance}")
          for path in [
              root / "OmicsTopology_PLOS_Comp_Biol_manuscript.docx",
              root / "OmicsTopology_PLOS_Comp_Biol_manuscript.pdf",
              root / "OmicsTopology_PLOS_Comp_Biol_supporting_information.docx",
              root / "OmicsTopology_PLOS_Comp_Biol_supporting_information.pdf",
              root / "Main_figures.pdf",
              root / "Supplementary_figures.pdf",
          ]:
              if not path.is_file() or path.stat().st_size < 1000:
                  raise SystemExit(f"Missing or empty build output: {path}")
          if len(list((root / "figures").glob("Fig*.svg"))) != 6:
              raise SystemExit("Expected six editable main-figure SVGs")
          if len(list((root / "supplementary_figures").glob("S*_Fig.svg"))) != 11:
              raise SystemExit("Expected eleven editable supplementary-figure SVGs")
          print(f"Validated {len(ref_numbers)} sequential references, in-text citations, and all manuscript/figure outputs.")
          PY

      - name: Commit generated publication assets as omixcore
        shell: bash
        run: |
          git config user.name "omixcore"
          git config user.email "fei48548@gmail.com"
          git add publication/ README.md .github/workflows/build-plos-publication.yml
          if ! git diff --cached --quiet; then
            git commit -m "Add PLOS Computational Biology manuscript and figures"
            git fetch origin submission/plos-computational-biology
            if git diff --name-only HEAD..origin/submission/plos-computational-biology | grep -Eq '^publication/(OmicsTopology_PLOS_Comp_Biol_(manuscript|supporting_information)\\.md|build_publication\\.py|figures/.*\\.svg|supplementary_figures/.*\\.svg); then
              echo "A manuscript or figure source changed during this build; refusing to push stale generated outputs."
              exit 1
            fi
            git rebase origin/submission/plos-computational-biology
            git push origin HEAD:submission/plos-computational-biology
          else
            echo "No generated changes to commit."
          fi
