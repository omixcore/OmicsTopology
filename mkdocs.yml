site_name: OmicsTopology
site_description: Topological data analysis of omics state spaces
docs_dir: docs
nav:
  - Home: index.md
  - Evidence: results.md
  - API reference: api.md
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
plugins:
  - search
strict: false
